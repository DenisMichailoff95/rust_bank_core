syntax = "proto3";

package bank.client.v1;

service ClientService {
  rpc CreateClient(CreateClientRequest) returns (CreateClientResponse);
  rpc GetClient(GetClientRequest) returns (GetClientResponse);
  rpc UpdateClientStatus(UpdateClientStatusRequest) returns (UpdateClientStatusResponse);
}

message CreateClientRequest {
  string last_name = 1;
  string first_name = 2;
  string middle_name = 3;
  string birth_date = 4;          // ISO 8601: 1985-03-12
  string passport_series = 5;
  string passport_number = 6;
  string phone = 7;
  string email = 8;
  string address = 9;
  string idempotency_key = 100;   // ключ идемпотентности
}

message CreateClientResponse {
  string client_id = 1;
  string status = 2;
}

message GetClientRequest {
  string client_id = 1;
}

message GetClientResponse {
  string client_id = 1;
  string last_name = 2;
  string first_name = 3;
  string middle_name = 4;
  string birth_date = 5;
  string passport_series = 6;
  string passport_number = 7;
  string status = 8;
  string phone = 9;
  string email = 10;
  string address = 11;
  string created_at = 12;
}

message UpdateClientStatusRequest {
  string client_id = 1;
  string new_status = 2;          // active / blocked / closed
  string reason = 3;
  string idempotency_key = 100;
}

message UpdateClientStatusResponse {
  string client_id = 1;
  string old_status = 2;
  string new_status = 3;
}